<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe WebPage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <section class="image_section">
            <aside>
                <img src="./side_image1.png" alt="">
                <img src="./side_image2.png" alt="">
                <img src="./side_image3.png" alt="">
                <img src="./side_image4.png" alt="">
                <img src="./side_image5.png" alt="">
                <img src="./side_image6.png" alt="">
            </aside>
            <section class="image_container"> 
                <img src="./center_image.png" alt="">
            </section>
            <section class="content">
                <div class="content_header">
                    <p class="green-text">Sustainable Material</p>
                    <h1>NIke Revolution 8</h1>
                    <h4>Mens Road Running Shoes</h4>
                </div>
                <section class="price_section">
                    <h2>MRP- $0.00</h2>
                    <p>Inclusive of all taxes</p>
                    <p>Also Includes all Applicable duties</p>
                </section>


                <section class="varient_section">
                    <img src="./variant1.png" alt="">
                    <img src="./variant2.png" alt="">
                    <img src="./variant3.png" alt="">
                    <img src="./variant4.png" alt="">
                </section>


                <section class="sizes">
                    <div class="size">UK 6</div>
                    <div class="size">UK 7</div>
                    <div class="size">UK 8</div>
                    <div class="size">UK 9</div>
                </section>

                <section class="button_container">
                    <button class="add_to_cart">Add to Cart</button>
                    <button class="Wishlist">Wishlist</button>
                </section>
            </section>
        </section>
    </main>
</body>
</html>
